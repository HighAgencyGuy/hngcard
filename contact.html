<!doctype html>
<html lang="en">
<head data-testid="test-head">
  <meta charset="utf-8" data-testid="test-meta-charset">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-testid="test-meta-viewport">
  <title data-testid="test-title">Contact Us</title>
  <link rel="stylesheet" href="css/contact.css" data-testid="test-style">
</head>
<body>
  <div class="site-nav" data-testid="test-site-nav">
    <div class="site-nav-inner">
      <div class="brand">Ferguson's App</div>
      <div class="links">
        <a href="index.html" data-testid="test-link-home">Home</a>
        <a href="contact.html" aria-current="page" data-testid="test-link-contact">Contact</a>
        <a href="about.html" data-testid="test-link-about">About</a>
      </div>
    </div>
  </div>

  <main class="main" data-testid="test-contact-page">
    <article class="panel" aria-labelledby="contact-title">
      <header>
        <h1 id="contact-title">Contact Us</h1>
        <p class="muted">All fields are required. Message must be at least 10 characters.</p>
      </header>

      <form id="contact-form" novalidate data-testid="test-contact-form">
        <div class="row">
          <label for="contact-name" data-testid="test-contact-label-name">Full name</label>
          <input id="contact-name" name="name" type="text" required
                 aria-describedby="test-contact-error-name" aria-invalid="false"
                 data-testid="test-contact-name">
          <p id="test-contact-error-name" class="error" data-testid="test-contact-error-name" hidden></p>
        </div>

        <div class="row">
          <label for="contact-email" data-testid="test-contact-label-email">Email</label>
          <input id="contact-email" name="email" type="email" required
                 aria-describedby="test-contact-error-email" aria-invalid="false"
                 data-testid="test-contact-email">
          <p id="test-contact-error-email" class="error" data-testid="test-contact-error-email" hidden></p>
        </div>

        <div class="row">
          <label for="contact-subject" data-testid="test-contact-label-subject">Subject</label>
          <input id="contact-subject" name="subject" type="text" required
                 aria-describedby="test-contact-error-subject" aria-invalid="false"
                 data-testid="test-contact-subject">
          <p id="test-contact-error-subject" class="error" data-testid="test-contact-error-subject" hidden></p>
        </div>

        <div class="row">
          <label for="contact-message" data-testid="test-contact-label-message">Message</label>
          <textarea id="contact-message" name="message" minlength="10" required
                    aria-describedby="test-contact-error-message" aria-invalid="false"
                    data-testid="test-contact-message"></textarea>
          <p id="test-contact-error-message" class="error" data-testid="test-contact-error-message" hidden></p>
        </div>

        <button type="submit" id="contact-submit" data-testid="test-contact-submit">Send</button>

        <div id="contact-success" class="success" role="status" aria-live="polite" data-testid="test-contact-success" hidden>
          Thank you — your message has been received.
        </div>
      </form>
    </article>
  </main>

  <script src="js/contact.js" data-testid="test-script"></script>

</html>
